# =====================================================================
# K2-eigene Module für Upstream-Klipper (pi-host/k2_*.py)
# =====================================================================
# ENTWURF 16.10.2026 – am Gerät UNGETESTET. Eingebunden von printer.cfg.
# [k2_prtouch] steht in printer.cfg (SAVE_CONFIG von z_offset).
#
# [k2_motor] steht in k2-motor.cfg.
#
# Installation (README.md §3) – alles nach ~/klipper/klippy/extras/:
#   pi-host/k2_transport.py   -> extras/k2_transport.py
#   pi-host/k2_485.py         -> extras/k2_485.py
#   pi-host/k2_motor_init.py  -> extras/k2_motor.py   (Name = Abschnitt!)
#   pi-host/k2_box.py         -> extras/k2_box.py
#   pi-host/k2_prtouch.py     -> extras/k2_prtouch.py
#   pi-host/k2_belt.py        -> extras/k2_belt.py
#   nachbau/*.py              -> extras/k2_nachbau/   (Pflicht für k2_box,
#                               k2_485; wird nur ANGEHÄNGT an sys.path)
#
# RS485 (Stock /dev/ttyS5, 230400 8N1, EIN Bus für Motoren X/Y/Z/Z1 + CFS +
# Belt): auf dem Pi ein USB-RS485-Adapter mit Auto-DE. Gemeinsames Objekt
# 'k2_485' (Modul k2_485.py): GENAU EINE nachbau/serial485.Serial485-Instanz
# (ein Port, ein Lock). [k2_motor] (X/Y/Z/Z1), [k2_box] und [k2_belt] nutzen
# sie; die Reihenfolge der Abschnitte ist egal.
# Port wird erst beim Connect geöffnet (Batch-Modus: nie). Fehlt der Port,
# meldet [k2_485] das beim Connect und bei jedem Zugriff – kein Absturz,
# kein Shutdown (README.md §6.2, k2_485.py-Docstring). KTWO_BUS_STATUS zeigt
# Zustand/Zähler ohne Bus-Verkehr.
# ---------------------------------------------------------------------
[k2_485]
# PLATZHALTER/ANNAHME – echten Namen per `ls -l /dev/serial/by-id/` eintragen
serial: /dev/serial/by-id/usb-ANNAHME_USB-RS485-if00-port0
baud: 230400

# ---------------------------------------------------------------------
# CFS-Box (Ersatz für Creality-[box] + [serial_485 serial485] + [auto_addr])
# ---------------------------------------------------------------------
# Auto-Addr läuft erst nach dem Event k2_motor:ready (gleiche Reihenfolge
# wie Stock). Stock-[box]-Werte (Positionen für Cutter/Purge/Wischen,
# Temperaturen) sind KEINE k2_box-Optionen – sie gehören in die künftigen
# Wechsel-Makros und stehen hier nur als Referenz:
#   pre_cut_pos_x 10 / pre_cut_pos_y 200, cut_pos_y 200, cut_velocity 30000,
#   SAVE_CONFIG cut_pos_x -7.80 (kalibriert), check_cut_pos_x_min/max -9.5/-5.5,
#   pre_cut_cal_pos_x -5, Tn_retrude -10 @600, Tn_extrude 140 @360,
#   Tn_extrude_temp 220, buffer_empty_len 30, extrude_pos 133/378,
#   clean_left 135/378, clean_right 160/378, clean_velocity 12000,
#   box_need_clean_length 70, clean_pos_left_x 160 / right_x 170 / middle_y 374,
#   safe_pos 225/345, switch_pin !nozzle_mcu:PB9 (Schneid-/Kopfschalter)
[k2_box]
box_addr: 1
# GESPERRT: nur lesen (0x0a-Poll, RFID, Remain, Version). Load/Unload/
# Preload/Auto-Addr erst mit True.
allow_write: False
shutdown_on_failure: False
auto_init: True
poll_interval: 4.0

# ---------------------------------------------------------------------
# Riemenspannungs-Module (Ersatz für Creality-[belt_mdl mdlx/mdly])
# ---------------------------------------------------------------------
# Modul pi-host/k2_belt.py -> klippy/extras/k2_belt.py (README-k2_belt.md).
# Werte 1:1 Stock; Adresse aus dem Namen (mdlx 0x21, mdly 0x22). Holt den Bus
# 'k2_485' wie [k2_box] (s. oben). GESPERRT: allow_write
# (Flash: CALI/MOVE/SET) und allow_move (Schieber/Motor-0x05/FORCE_MOVE).
# Achtung: KTWO_BELT_CALI nur OHNE Riemen. Der Rüttel-Zyklus (Default-
# cycle_gcode) fährt X/Y per FORCE_MOVE je ±200 mm ohne Endschalterschutz.
# Stock-Makro BELT_TENSION ist bewusst NICHT aktiv (fährt G28 X Y + Spannen);
# Ersatz-Beispiel KTWO_BELT_TENSION steht in README-k2_belt.md und ist unter
# Upstream jetzt gültig – erst nach Freigabe (README-k2_belt.md §6) einfügen.
[k2_belt mdlx]
ch_max_dis: 5
ch_best_n: 140
ch_best_error: 0.15
allow_write: False
allow_move: False
stock_aliases: False

[k2_belt mdly]
ch_max_dis: 5
ch_best_n: 140
ch_best_error: 0.15
allow_write: False
allow_move: False
stock_aliases: False
