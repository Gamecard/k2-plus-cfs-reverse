# =====================================================================
# Homing K2 Plus (Ersatz für Stock-sensorless.cfg)
# =====================================================================
# ENTWURF 16.10.2026 – am Gerät UNGETESTET.
#
# Entscheidung: [homing_override] statt [safe_z_home] (beide zusammen
# verbietet Upstream). Gründe:
#  1. Stock-Reihenfolge Y -> X -> Z mit Freifahren nach jeder Achse
#     (sensorless.cfg _HOME_Y/_HOME_X: G1 Y+10 / X-10) braucht ein Makro.
#  2. Die Closed-loop-Motoren müssen VOR dem X/Y-Homing in Stall-Mode 1
#     (Endschalter-/Blockiersignal auf PB11/PB12) und danach zurück in
#     Mode 2 (Notfall-Schutzausgang) – Stock: MOTOR_STALL_MODE DATA=1/2,
#     dazu Kp ID 70 300 -> 100 und MOTOR_CHECK_PROTECTION_AFTER_HOME DATA=11.
#     Diese Haken (_PI_VOR_HOMING/_PI_NACH_HOMING) gehen nur mit Override.
#  3. Zentrale Sperre: ohne Freigabe (_PI_FREIGABE allow_move) bricht G28
#     VOR jeder Bewegung ab.
# Z wird wie Stock in der Mitte des Mesh-Bereichs angetastet (175/175),
# Geschwindigkeit aus [stepper_z] homing_speed 5 / second_homing_speed 5.
#
# Stock-Teile, die ENTFALLEN (README §2/§6):
#  - BOX_GO_TO_EXTRUDE_POS / PRES_CHECK / BOX_NOZZLE_CLEAN vor dem ersten
#    Z-Homing (Düse am Silikonstreifen reinigen – OFFEN, wichtig für die
#    Genauigkeit des Kraftsensors).
#  - FORCE_MOVE STEPPER=stepper_y DISTANCE=-3 nach dem XY-Homing: bei
#    CoreXY verschiebt das ohne Positionsupdate X und Y um je 1,5 mm
#    (Creality-force_move evtl. anders) – Wirkung UNKLAR, bewusst NICHT
#    übernommen; am Gerät gegen Stock-Koordinaten prüfen (README §6).
#  - BED_MESH_PROFILE LOAD="default" nach jedem Homing (Upstream lädt
#    das Profil "default" beim Start selbst; Altprofil heißt anders).
#  - print_stats.power_loss-Zweige (Power-Loss-Resume, Creality).
# =====================================================================

[gcode_macro _PI_FREIGABE]
description: Zentrale Bewegungs-Freigabe (Default gesperrt)
# False = G28 bricht ohne Bewegung ab. Erst nach Inbetriebnahme-Schritt 4
# (README §4) auf True setzen (hier ODER zur Laufzeit:
# SET_GCODE_VARIABLE MACRO=_PI_FREIGABE VARIABLE=allow_move VALUE=True).
variable_allow_move: False
# True erst, wenn feststeht, dass PB11/PB12 beim Blockieren auslösen
# (Stall-Mode 1 gesetzt, z.B. per künftigem KTWO_MOTOR_STALL_MODE). Ohne das
# fährt X/Y beim Homing bis zur Blockade, ohne dass der Endstop auslöst!
variable_xy_stall_ok: False
gcode:
  {action_respond_info("_PI_FREIGABE: allow_move=%s xy_stall_ok=%s" % (
      printer["gcode_macro _PI_FREIGABE"].allow_move,
      printer["gcode_macro _PI_FREIGABE"].xy_stall_ok))}

[gcode_macro _PI_VOR_HOMING]
description: Haken vor dem Homing (Stock: Stall-Mode 1, Kp ID70 300)
gcode:
  # OFFEN: [k2_motor] hat noch keinen G-Code für 0x11 Stall-Mode und
  # 0x06 Sys-Param. Stock an dieser Stelle:
  #   MOTOR_STALL_MODE DATA=1
  #   MOTOR_SYS_PARAM NUM=1 DATA=1 ID=70 PARAMS=300 PARAMS_TYPE=float
  M204 S500

[gcode_macro _PI_NACH_HOMING]
description: Haken nach dem Homing (Stock: Stall-Mode 2, Schutz, Kp 100)
gcode:
  # OFFEN, Stock an dieser Stelle:
  #   MOTOR_STALL_MODE DATA=2
  #   MOTOR_CHECK_PROTECTION_AFTER_HOME DATA=11
  #   MOTOR_SYS_PARAM NUM=1 DATA=1 ID=70 PARAMS=100 PARAMS_TYPE=float
  M204 S{printer.configfile.settings.printer.max_accel}

[homing_override]
axes: xyz
gcode:
  {% set fr = printer["gcode_macro _PI_FREIGABE"] %}
  {% if not fr.allow_move %}
    {action_raise_error("G28 gesperrt: _PI_FREIGABE allow_move=False (README §4). Keine Bewegung.")}
  {% endif %}
  {% set homed = printer.toolhead.homed_axes %}
  {% set home_all = 'X' not in params and 'Y' not in params and 'Z' not in params %}
  {% set do_y = home_all or 'Y' in params %}
  {% set do_x = home_all or 'X' in params %}
  {% set do_z = home_all or 'Z' in params %}
  {% if (do_x or do_y) and not fr.xy_stall_ok %}
    {action_raise_error("G28 X/Y gesperrt: _PI_FREIGABE xy_stall_ok=False (Stall-Mode 1 fehlt, README §6).")}
  {% endif %}
  {% if do_z and not do_x and not do_y and ('x' not in homed or 'y' not in homed) %}
    {action_raise_error("G28 Z braucht vorher X und Y (Antasten in Bettmitte).")}
  {% endif %}
  {% if 'z' not in homed %}
    BED_MESH_CLEAR
  {% endif %}
  _PI_VOR_HOMING
  {% if do_y %}
    G28 Y
    G91
    G1 Y10 F3600
    G90
  {% endif %}
  {% if do_x %}
    G28 X
    G91
    G1 X-10 F3600
    G90
  {% endif %}
  {% if do_z %}
    # Mitte des Mesh-Bereichs (Stock _HOME_Z), Kühlung Düsenkopf aus wie Stock
    {% set bm = printer.configfile.settings.bed_mesh %}
    {% set cx = (bm.mesh_min[0] + bm.mesh_max[0]) / 2 %}
    {% set cy = (bm.mesh_min[1] + bm.mesh_max[1]) / 2 %}
    SET_PIN PIN=extruder_fan VALUE=0
    M204 S2000
    G90
    G1 X{cx} Y{cy} F12000
    M204 S500
    G28 Z
    G1 Z5 F600
  {% endif %}
  _PI_NACH_HOMING
