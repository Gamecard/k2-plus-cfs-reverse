# =====================================================================
# K2 Plus (F008) – Upstream-Klipper-Konfiguration für den Pi-CM5-Host
# =====================================================================
# ENTWURF 16.10.2026 – am Gerät UNGETESTET. Nur offline gegen
# Upstream-Klipper (Commit 9cb9975) im Batch-Modus geprüft (README.md §5).
#
# Grundlage: Stock-Configs live 16.10.2026 (live-logs-2026-10-16/
# config-aktuell/printer.cfg + sensorless.cfg + printer_params.cfg +
# box.cfg + motor_control.cfg + gcode_macro.cfg).
# MCU-Firmware bleibt die ORIGINALE Creality-Firmware:
#   Main-MCU  GD32F303RET6 (gd32f303xe), 1.1.0.48-293-g493f9a0f
#   Düsen-MCU GD32F303CBT6 (gd32f303xb), 1.1.0.48-293-g493f9a0f
#
# SICHERHEIT: Alles, was bewegt oder schreibt, ist per Default GESPERRT:
#   [k2_prtouch] allow_move: False, [k2_motor] allow_write: False,
#   [k2_box] allow_write: False, Makro _PI_FREIGABE allow_move: False
#   (sperrt G28/Homing). Freigabe nur schrittweise laut README.md §4.
#
# Zuordnung Stock-Abschnitt -> dieser Datei: README.md §2.
# Alles mit ANNAHME ist nicht belegt.
# =====================================================================


# ---------------------------------------------------------------------
# MCUs (Serial-Pfade = PLATZHALTER, ANNAHME)
# ---------------------------------------------------------------------
# Stock: /dev/ttyS2 (Main) und /dev/ttyS3 (Düse) am T113, je 230400 8N1.
# Auf dem Pi: je ein 3,3-V-USB-UART (PI-ERSATZ-PLAN §2/§3). Den echten
# Namen nach dem Anstecken mit `ls -l /dev/serial/by-id/` ermitteln und
# hier eintragen. Baudrate MUSS 230400 bleiben (MCU-Konstante
# SERIAL_BAUD=230400 im Dictionary).
[mcu]
serial: /dev/serial/by-id/usb-ANNAHME_USB-UART_Main-MCU-if00-port0
baud: 230400
restart_method: command

[mcu nozzle_mcu]
serial: /dev/serial/by-id/usb-ANNAHME_USB-UART_Duesen-MCU-if00-port0
baud: 230400
restart_method: command

# ---------------------------------------------------------------------
# Kraftsensor-Düse = Probe (Upstream-[probe]-Ersatz, Modul k2_prtouch.py)
# Steht hier (nicht in k2-module.cfg), weil PROBE_CALIBRATE/SAVE_CONFIG
# z_offset in die Hauptdatei schreibt – Upstream verbietet SAVE_CONFIG-
# Werte für Abschnitte aus Include-Dateien.
# Stock-[prtouch_v3] -> README.md §2 (welche Optionen übernommen/entfallen).
# Die Position vor den Includes ist seit dem Modul-Fix 16.10.2026 NICHT mehr
# nötig (kein Modul hängt klippy/extras/ mehr vorn an sys.path, README §5.3
# Punkt 5) – sie bleibt nur, damit Kraftsensor und Motoren oben stehen.
# ---------------------------------------------------------------------
[k2_prtouch]
# Rückfall 'mode: steps' (Host stoppt): seit 17.10.2026 gleiche Arm-/Ruhetest-/
# Disarm-Reihenfolge wie hier, Mindestgeschwindigkeit gilt dann für
# probe_speed (README-k2_prtouch B.1/B.2; Kontaktkriterium = ANNAHME).
mode: probe
# GESPERRT bis KTWO_PRTOUCH_TEST_SWAP/READ/QUERY_PROBE erfolgreich (README §4)
allow_move: False
# Stock speed: 5 (harte Grenze im Modul: <= 5 mm/s). Untergrenze seit
# 17.10.2026: 2,5 mm/s bei Stock-Schwellen (ANNAHME, MCU-Befund §3.5: zu
# flacher Kraftanstieg löst nie aus) – gilt auch für PROBE_SPEED= und
# homing_speed/second_homing_speed in [stepper_z].
speed: 5.0
lift_speed: 5.0
# Stock z_offset: 0 (Düse = Taster)
z_offset: 0.0
# Stock samples: 1, samples_result: average, samples_tolerance: 0.5,
# samples_tolerance_retries: 5
samples: 1
sample_retract_dist: 2.0
samples_result: average
samples_tolerance: 0.5
samples_tolerance_retries: 5
probe_max_travel_mm: 8.0
# Wartezeit nach dem Scharfschalten: Pflicht >= 1,5 × max(lmt_dead, 128)
# Samples × 1/1280 s = 0,15 s (Totzeit, MCU-Befund §3.2/§7.2).
arm_settle_s: 0.2
swap_check: True
# Ruhetest: dif, Rohwert != -1/24 Bit/nicht konstant, Tickabstand 0,78 ms
# ±10 %, gefilterter Kanal max <= rest_filt_max_frac × min_hold (ANNAHMEN).
rest_check: True
rest_max_dif: 3000
#rest_filt_max_frac: 0.5
main_mcu: mcu
nozzle_mcu: nozzle_mcu
# '^' = Pull-Up wie Stock-Endzustand. In der Creality-FW heißt pull_up=0
# Pull-DOWN (Stock '!PC7' wird erst durch das NACHFOLGENDE
# config_prtouch_step auf Pull-Up gesetzt; bei uns kommt es davor). Das
# Modul lehnt '!PC7' ohne '^' ab (MCU-Befund §4.5, README-k2_prtouch A.8).
step_swap_pin: ^!PC7
pres_swap_pin: nozzle_mcu:PA15
pres_cs0_pin: nozzle_mcu:PB13, nozzle_mcu:PB14
# Antast-Parameter (Stock-Werte, Abbildung BELEGT PRTOUCH-LESETEST §7).
# Beim Laden geprüft (MCU-Befund §7.1): pres_cfg_regs 60/56/44,
# pres_tri_hold min != max (sonst nie Auslösung!), min >= 1000, add >= 0,
# pres_tri_fter[1] > 0 (Hochpass Pflicht), [2] in [0, 1],
# pres_ded_tkms >= 64 (Samples).
pres_cfg_regs: 60
pres_acq_tkms: 0.78125
pres_tri_fter: 5, 1, 0.8
pres_tri_hold: 4000, 10000, 500
pres_ded_tkms: 128.0
step_acq_tkms: 0.390625

# Module ab Modul-Fix 16.10.2026 abends (KTWO_*-Befehle, k2_motor 'pins'/
# Config-Callback, k2_485): Batch-Lauf F ohne Testpatches fehlerfrei
# (README.md §5).
[include k2-motor.cfg]
[include k2-module.cfg]
[include homing.cfg]
[include macros.cfg]
[include cutcal.cfg]
# A10 (17.10.2026): Dual-Z-Lichtschranken PA15/PA8 – aktiv nur LESEND
# ([gcode_button]); Ausrichtung [k2_zalign] auskommentiert + gesperrt
# (zalign.cfg, NOTIZ-zalign.md).
[include zalign.cfg]

# [mcu rpi] + [bl24c16f] (Stock: Host-MCU /tmp/klipper_host_mcu + EEPROM
# an i2c.1 des T113 für Power-Loss) ENTFALLEN bewusst: Der EEPROM sitzt am
# Upper-Board, das der Pi ersetzt; ohne ihn braucht es keine Linux-Host-MCU
# (und kein eigenes Dictionary). Siehe README.md §2.

# ---------------------------------------------------------------------
# Kinematik
# ---------------------------------------------------------------------
[printer]
kinematics: corexy
max_velocity: 800
max_accel: 30000
# Stock: max_accel_to_decel: 30000 (= max_accel). Upstream kennt die Option
# nicht mehr; gleichwertig ist minimum_cruise_ratio: 0.0 (keine Begrenzung).
minimum_cruise_ratio: 0.0
square_corner_velocity: 10
max_z_velocity: 30
max_z_accel: 1000

# ---------------------------------------------------------------------
# Stepper (Pins/Werte 1:1 Stock). Alle Motoren sind Closed-loop-Treiber
# mit STEP/DIR-Eingang; Enable gemeinsam !PA9.
# X/Y: "Sensorless" = Stall-Ausgang des Motortreibers auf PB11/PB12
# (motor_control.cfg: motor_x_stall PB11, motor_y_stall PB12). Upstream
# sieht das als normalen Endstop. Voraussetzung: Stall-Mode 1
# (MOTOR_STALL_MODE DATA=1) – siehe homing.cfg, OFFEN.
# ---------------------------------------------------------------------
[stepper_x]
step_pin: PB8
dir_pin: !PB7
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB11
position_endstop: 352.5
position_min: -10
position_max: 352.5
homing_speed: 100
homing_retract_dist: 10

[stepper_y]
step_pin: PB10
dir_pin: PB9
enable_pin: !PA9
microsteps: 16
rotation_distance: 40
endstop_pin: PB12
position_endstop: -6.2
position_min: -6.2
position_max: 400
homing_speed: 100
homing_retract_dist: 10

[stepper_z]
step_pin: PB6
dir_pin: PB5
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
# Z-Endstop = Kraftsensor-Düse über [k2_prtouch] (registriert "probe";
# Stopp über !PC7 + trsync wie Stock).
endstop_pin: probe:z_virtual_endstop
position_min: -10
position_max: 360
# k2_prtouch lehnt G28 Z mit homing_speed/second_homing_speed außerhalb 2,5–5 mm/s ab
# (Untergrenze ANNAHME, PRTOUCH-MCU-BEFUND §7 / README-k2_prtouch A.8).
homing_speed: 5
second_homing_speed: 5
homing_retract_dist: 5

[stepper_z1]
step_pin: PB15
dir_pin: PA1
enable_pin: !PA9
microsteps: 16
rotation_distance: 8
# Stock: endstop_pin: probe:z_virtual_endstop. Upstream: KEIN endstop_pin
# – Klipper hängt alle Z-Stepper an den Endstop von stepper_z
# (k2_prtouch nutzt dafür LookupZSteppers).

# Strapping (k2_motor setzt Dir/Step als digital_out vor dem Motor-
# Broadcast), geteilte Lüfter-/ADC-Pins und Endstop PC7 (zugleich
# prtouch-Swap) – 1:1 Stock-Liste, ergänzt um nozzle_mcu:PB1
# (hotend_fan-multi_pin + extruder_fan nutzen beide PB1 der Düsen-MCU;
# Upstream unterscheidet Pins je MCU, Stock-Liste meinte vermutlich diesen).
[duplicate_pin_override]
pins: PC5,PA0,PC7,PB7,PB8,PB9,PB10,PB5,PB6,PA1,PB15,PB11,PB12,PB13,PA10,PA9,PB2,PB14,PB1,nozzle_mcu:PB1

# ---------------------------------------------------------------------
# Extruder + Hotend (Düsen-MCU)
# ---------------------------------------------------------------------
[thermistor my_thermistor]
temperature1: 25
resistance1: 260000
temperature2: 220
resistance2: 738
temperature3: 350
resistance3: 98

[extruder]
step_pin: nozzle_mcu:PB5
dir_pin: !nozzle_mcu:PB4
enable_pin: !nozzle_mcu:PB2
microsteps: 16
rotation_distance: 6.9
nozzle_diameter: 0.400
filament_diameter: 1.750
max_extrude_cross_section: 100
max_extrude_only_distance: 1000.0
heater_pin: nozzle_mcu:PB8
sensor_type: my_thermistor
sensor_pin: nozzle_mcu:PA0
pressure_advance: 0.038
pressure_advance_smooth_time: 0.038
control: pid
pid_kp: 14.296
pid_ki: 1.271
pid_kd: 40.206
# Stock-Sonderoptionen (Creality) ENTFALLEN – Upstream kennt keinen
# zweiten PID-Satz:
#   high_temp_value: 280
#   pid_kp_high_temp: 16.443 / pid_ki_high_temp: 1.370 / pid_kd_high_temp: 49.329
# OFFEN: für Hochtemperatur-Filamente ggf. per Makro SET_HEATER_PID
# o.ä. umschalten oder einen Kompromiss-PID messen (PID_CALIBRATE).
min_temp: -30
max_temp: 390

[verify_heater extruder]
check_gain_time: 60
heating_gain: 1.0

# ---------------------------------------------------------------------
# Heizbett
# ---------------------------------------------------------------------
[heater_bed]
heater_pin: PC8
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC4
control: pid
pid_kp: 37
pid_ki: 0.18
pid_kd: 280
min_temp: -30
max_temp: 135

[verify_heater heater_bed]
check_gain_time: 120
heating_gain: 1.0
hysteresis: 10

# ---------------------------------------------------------------------
# Kammer (PTC-Heizung, Kammerlüfter, Kammer-NTC) – 1:1 Stock
# PC5 wird von drei Abschnitten als ADC gelesen (Stock identisch,
# duplicate_pin_override).
# ---------------------------------------------------------------------
[heater_generic chamber_heater]
heater_pin: PC12
max_power: 1.0
sensor_type: NTC 100K MGB18-104F39050L32
sensor_pin: PC5
control: watermark
min_temp: -30
max_temp: 80

[verify_heater chamber_heater]
max_error: 80
check_gain_time: 345600
hysteresis: 15
heating_gain: 1

[temperature_sensor chamber_temp]
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 125

[temperature_fan chamber_fan]
pin: PA0
cycle_time: 0.0100
hardware_pwm: false
max_power: 1
shutdown_speed: 0
sensor_type: EPCOS 100K B57560G104F
sensor_pin: PC5
min_temp: -30
max_temp: 80
control: watermark
max_delta: 0.5
target_temp: 35.0
max_speed: 1.0
min_speed: 0.0

# PTC-Lüfter der Kammerheizung. Stock-Option `is_ptc_fan: 1` (Creality)
# ENTFÄLLT. Upstream-heater_fan läuft ohnehin, sobald chamber_heater ein
# Ziel > 0 hat (heater_fan.py: "if target_temp or temp > heater_temp");
# heater_temp 100 (unerreichbar) verhindert nur den Nachlauf – wie Stock.
# ANNAHME: is_ptc_fan bewirkte genau dieses Mitlaufen. Am Gerät prüfen
# (M141 S45 -> PTC-Lüfter muss sofort laufen), sonst Überhitzungsgefahr!
[heater_fan chamber_fan]
pin: !PB14
enable_pin: PB2
heater: chamber_heater
heater_temp: 100

# ---------------------------------------------------------------------
# Lüfter (1:1 Stock als output_pin, damit die Slicer-Makros M106/M107
# mit P0/P1/P2 wie bei Stock funktionieren, s. macros.cfg)
#   fan0 = Bauteillüfter (Düse, mit fan0_en), fan1 = Kammer/Abluft (PA0,
#   teilt den Pin mit temperature_fan chamber_fan – Stock identisch!),
#   fan2 = Seitenlüfter (PB4+PB3)
# ---------------------------------------------------------------------
[multi_pin heater_fans]
pins: nozzle_mcu:PB7, nozzle_mcu:PB1

[heater_fan hotend_fan]
pin: multi_pin:heater_fans
heater: extruder
heater_temp: 50.0

[output_pin fan0_en]
pin: nozzle_mcu:PB6

[output_pin fan0]
pin: !nozzle_mcu:PB15
pwm: True
cycle_time: 0.01
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin fan1]
pin: PA0
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[multi_pin heater_fan2]
pins: PB4, PB3

[output_pin fan2]
pin: multi_pin:heater_fan2
pwm: True
cycle_time: 0.0100
hardware_pwm: false
value: 0.00
scale: 255
shutdown_value: 0.0

[output_pin extruder_fan]
pin: nozzle_mcu:PB1

# ---------------------------------------------------------------------
# Licht, Netz, PTC-Versorgung (1:1 Stock; Bedeutung PC9 "power" ANNAHME:
# Schaltausgang, Stock-Default 0)
# ---------------------------------------------------------------------
[multi_pin LED_pin]
pins: PB0, PA12

[output_pin LED]
pin: multi_pin:LED_pin
pwm: True
cycle_time: 0.010
value: 1

[output_pin power]
pin: PC9

[output_pin ptc_power]
pin: PB2
value: 1

# ---------------------------------------------------------------------
# Sensoren
# ---------------------------------------------------------------------
# Filamentsensor am Kopf (1:1 Pin). Stock: pause_on_runout true +
# runout_gcode "G0 E30 F600 (wenn heiß) + BOX_CHECK_MATERIAL_REFILL".
# Pi (A7, NOTIZ-runout.md): Upstream pausiert bei pause_on_runout VOR dem
# runout_gcode (filament_switch_sensor.py: send_pause_command + "PAUSE\n" +
# Vorlage) – darum True wie Stock. KTWO_BOX_RUNOUT lädt im Pausenzustand
# aus der CFS nach (Ersatz-Slot gleiches Material/Farbe) und setzt per
# RESUME fort; E30 macht es im Abfallschacht (nicht am Parkpunkt über dem
# Bett). Ohne [k2_box] runout_refill/allow_write/allow_move, ohne Ersatz
# oder bei Fehlern bleibt der Druck pausiert (= Upstream-Standard).
[filament_switch_sensor filament_sensor]
pause_on_runout: True
switch_pin: ^!nozzle_mcu:PA11
runout_gcode:
  KTWO_BOX_RUNOUT

# [temperature_sensor mcu_temp] (Stock: sensor_type temperature_mcu)
# ENTFÄLLT: Upstream-temperature_mcu kennt "gd32f303xe" nicht und bricht
# mit "MCU temperature not supported on gd32f303xe" ab (temperature_mcu.py
# config_unknown). OFFEN: ggf. mit eigener Kalibrierung nachrüsten.

# Beschleunigungssensor: [k2_lis2dw] = Stock-[lis2dw] fuer Upstream-Klipper
# (altes Creality-MCU-Protokoll, Modul pi-host/k2_lis2dw.py, README-k2_lis2dw.md).
# Pins/Takt/Achsen 1:1 Stock.
[k2_lis2dw]
cs_pin: nozzle_mcu:PA4
spi_speed: 5000000
spi_software_sclk_pin: nozzle_mcu:PA5
spi_software_mosi_pin: nozzle_mcu:PA7
spi_software_miso_pin: nozzle_mcu:PA6
axes_map: x,z,y
#start_fifo_bypass: True   # False = Startablauf wie Creality-Host

# Stock-Werte. Messmethode: Upstream-Default = Sweep (sweeping_period 1.2 s,
# bewusst beibehalten). Creality-Stock misst per Einzelfrequenzen – wer exakt
# die Stock-Methode will, ergänzt hier "sweeping_period: 0".
[resonance_tester]
accel_chip: k2_lis2dw
probe_points:
   175,175,175
min_freq: 20
max_freq: 120
accel_per_hz: 100

# ---------------------------------------------------------------------
# Nivellierung (1:1 Stock)
# ---------------------------------------------------------------------
[z_tilt]
z_positions:
    -15, 175
    375, 175
points:
    5, 175
    345, 175
speed: 300
horizontal_move_z: 5
retries: 10
retry_tolerance: 0.1

[bed_mesh]
speed: 100
mesh_min: 5, 5
mesh_max: 345, 345
probe_count: 9, 9
mesh_pps: 2, 2
fade_start: 5.0
fade_end: 50.0
bicubic_tension: 0.2
algorithm: bicubic
horizontal_move_z: 5
split_delta_z: 0.01
# Stock: move_check_distance: 1 – Upstream verlangt >= 3.0 (Config-Fehler),
# daher Minimum 3 (feinere Segmentprüfung nur bei Creality-Klipper).
move_check_distance: 3

# Werte aus dem Stock-SAVE_CONFIG (live kalibriert), s. Block unten.
[input_shaper]

# ---------------------------------------------------------------------
# Allgemeines
# ---------------------------------------------------------------------
[virtual_sdcard]
# Stock: /mnt/UDISK/printer_data/gcodes + forced_leveling: true (Creality)
# ANNAHME: Standard-Pfad einer Moonraker-Installation als Benutzer "pi".
path: ~/printer_data/gcodes
# Bei Druckfehler aufräumen (Upstream-Default nur TURN_OFF_HEATERS; ergänzt
# nach Vanilla-Abgleich A8: Lüfter, Kammer, Pause-Zustand).
on_error_gcode: _PI_RESET_STATE

[gcode_arcs]
resolution: 0.012

[idle_timeout]
# Stock 1:1 (praktisch nie). ANNAHME Grund: Closed-loop-Motoren/Bett nicht
# stromlos schalten. Achtung: Heizungen werden dadurch NIE automatisch
# abgeschaltet – vor Dauerbetrieb bewusst entscheiden (README §6).
timeout: 99999999

# FORCE_MOVE/SET_KINEMATIC_POSITION (Stock: enable_force_move: true).
# Für die Inbetriebnahme nötig (k2_prtouch README A.6 Schritt 3).
[force_move]
enable_force_move: True

[pause_resume]

[exclude_object]

[display_status]

